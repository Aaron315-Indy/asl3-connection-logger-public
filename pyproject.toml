[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "asl3-connection-logger"
dynamic = ["version"]
description = "Connection history logger for AllStarLink 3"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [
    {name = "ASL3 Connection Logger Contributors"}
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
asl3_connection_logger = ["static/*.html", "static/*.css", "static/*.js", "build-info.json"]

[tool.setuptools.dynamic]
version = {attr = "asl3_connection_logger._version.VERSION"}

[project.scripts]
asl3-connection-logger = "asl3_connection_logger.__main__:main"
